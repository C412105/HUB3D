<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your 3D printer setup and filaments, and view your saved designs.">
    <title>HUB3D — Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="HUB3Dvo.css">
    <link rel="icon" type="image/svg+xml" href="Media/SVG/ISOTIPO.svg">
    <script src="HUB3dv0.js" defer></script>
</head>
<body>

    <!-- ========================== NAVBAR ========================== -->
    <nav id="navbar" class="navbar navbar-expand-lg mx-3 my-3">
        <div class="container-fluid">
            <a href="homeHUB3Dv0.html" class="navbar-brand mb-0 d-flex align-items-center">
                <img src="Media/SVG/LOGO_ANIMADO.svg" alt="HUB3D Logo" class="navbar-logo">
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item">
                        <a class="nav-link" href="designsHUB3Dv0.html">Designs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactHUB3Dv0.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ========================== CONTENT ========================== -->
    <main class="page-content container mt-4 mb-5">

        <!-- User info bar -->
         <!-- TO DO: Bring joined date and printer/filament quantities from backend -->
        <div id="profileHeader">
            <div id="profileAvatar">U</div>
            <div>
                <p class="profile-name">User_1234</p>
                <p class="profile-sub">Member since August 2025 · 2 printers · 2 filaments</p>
            </div>
            <button class="btn-logout ms-auto" type="button">Logout</button>
        </div>

        <!-- Printers & Filaments -->
        <div class="row g-4 align-items-start">

            <!-- Printers column -->
            <div class="col-lg-6">
                <h4 class="mb-3">My printer(s)</h4>

                <!-- Printer cards loaded dynamically from user_printers table (backend) -->
                <div id="userPrintersList"></div>

                <!-- Toggleable (printer checkbox panel collapse control) -->
                <button class="btn btn-sm mt-2"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#printerCollapse"
                        aria-expanded="false"
                        aria-controls="printerCollapse">
                    + Add printer
                </button>
            

            <!-- Populated dynamically from GET /api/equipment/printers on collapse open -->
            <div class="collapse mt-3" id="printerCollapse">
                <div class="equipment-group mb-3" role="group" aria-label="Printer selection">
                    <!-- checkboxes injected by JS -->
                </div>
                <div class="equipment-actions">
                    <button class="btn btn-sm" type="button" onclick="savePrinters()">Save</button>
                </div>
            </div>
            </div>

            <!-- Filaments column -->
            <div class="col-lg-6">
                <h4 class="mb-3">My filament(s)</h4>

                <!-- Filament cards loaded dynamically from user_filaments table (backend) -->
                <div id="userFilamentsList"></div>

                <!-- Toggleable (filament checkbox panel collapse control) -->
                <button class="btn btn-sm mt-2"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#filamentCollapse"
                        aria-expanded="false"
                        aria-controls="filamentCollapse">
                    + Add filament
                </button>

                <!-- Populated dynamically from GET /api/equipment/filaments on collapse open -->
                <div class="collapse mt-3" id="filamentCollapse">
                    <div class="equipment-group mb-3" role="group" aria-label="Filament selection">
                        <!-- checkboxes injected by JS -->
                    </div>
                    <div class="equipment-actions">
                        <button class="btn btn-sm" type="button" onclick="saveFilaments()">Save</button>
                    </div>
                </div>
            </div>

        </div>
        
    </main>

    <!-- ========================== FOOTER ========================== -->
    <footer id="disclaimer">
        <p class="mb-0">For educational purposes only · Not for commercial use · HUB3D 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- ========================== PROFILE FUNCTIONS ========================== -->
    <script>

        // ── On load: redirect if not logged in, populate header ─────────────
        document.addEventListener("DOMContentLoaded", () => {
            const userId   = sessionStorage.getItem("hub3d_user_id");
            const username = sessionStorage.getItem("hub3d_username") || "User";
            if (!userId) { window.location.href = "homeHUB3Dv0.html"; return; }

            // Avatar letter + display name from session
            document.getElementById("profileAvatar").textContent = username.charAt(0).toUpperCase();
            document.querySelector(".profile-name").textContent  = username;

            // Format joined date (stored as ISO string from Supabase)
            const joinedRaw = sessionStorage.getItem("hub3d_joined");
            const joinedStr = joinedRaw
                ? new Date(joinedRaw).toLocaleDateString("en-US", { month: "long", year: "numeric" })
                : "Unknown";
            // Store for use in loadUserEquipment stats bar
            window._joinedStr = joinedStr;

            loadUserEquipment();
        });

        // ── Logout ──────────────────────────────────────────────────────────
        document.querySelector(".btn-logout").addEventListener("click", () => {
            sessionStorage.removeItem("hub3d_user_id");
            sessionStorage.removeItem("hub3d_username");
            window.location.href = "homeHUB3Dv0.html";
        });

        // ── Load user's printers and filaments ───────────────────────────────
        async function loadUserEquipment() {
            const userId = sessionStorage.getItem("hub3d_user_id");
            if (!userId) return;

            // Printers
            const printerRows = await fetch("/api/equipment/user-printers",
                { headers: { "x-user-id": userId } }).then(r => r.json());

            const printersList = document.getElementById("userPrintersList");
            printersList.innerHTML = (printerRows || []).map(p => `
                <div class="profile-list-row" id="printer-row-${p.printer_id}">
                    <div>
                        <p class="item-label">${p.model}</p>
                        <p class="item-sub">${p.brand}</p>
                    </div>
                    <button class="btn-remove" onclick="removePrinter(${p.printer_id})">Remove</button>
                </div>
            `).join("");

            // Filaments
            const filamentRows = await fetch("/api/equipment/user-filaments",
                { headers: { "x-user-id": userId } }).then(r => r.json());

            const filamentsList = document.getElementById("userFilamentsList");
            filamentsList.innerHTML = (filamentRows || []).map(f => `
                <div class="profile-list-row" id="filament-row-${f.filament_id}">
                    <div>
                        <p class="item-label">${f.type}</p>
                        <p class="item-sub">All brands</p>
                    </div>
                    <button class="btn-remove" onclick="removeFilament(${f.filament_id})">Remove</button>
                </div>
            `).join("");

            // Stats bar
            const joined = window._joinedStr || "...";
            document.querySelector(".profile-sub").textContent =
                `Member since ${joined} · ${(printerRows || []).length} printer(s) · ${(filamentRows || []).length} filament(s)`;
        }

        // ── Remove a printer ─────────────────────────────────────────────────
        async function removePrinter(printerId) {
            const userId = sessionStorage.getItem("hub3d_user_id");
            await fetch(`/api/equipment/user-printers/${printerId}`, {
                method: "DELETE",
                headers: { "x-user-id": userId }
            });
            document.getElementById(`printer-row-${printerId}`)?.remove();
            loadUserEquipment();
        }

        // ── Remove a filament ────────────────────────────────────────────────
        async function removeFilament(filamentId) {
            const userId = sessionStorage.getItem("hub3d_user_id");
            await fetch(`/api/equipment/user-filaments/${filamentId}`, {
                method: "DELETE",
                headers: { "x-user-id": userId }
            });
            document.getElementById(`filament-row-${filamentId}`)?.remove();
            loadUserEquipment();
        }

        // ── Load all printers into collapse when it opens (Phase 6.4) ────────
        document.getElementById("printerCollapse")
            .addEventListener("show.bs.collapse", async () => {
                const printers = await fetch("/api/equipment/printers").then(r => r.json());
                const group = document.querySelector("#printerCollapse .equipment-group");
                group.innerHTML = printers.map(p => `
                    <input type="checkbox" class="btn-check" id="printer-${p.printer_id}" autocomplete="off">
                    <label class="btn" for="printer-${p.printer_id}">${p.brand} ${p.model}</label>
                `).join("");
            });

        // ── Load all filaments into collapse when it opens ───────────────────
        document.getElementById("filamentCollapse")
            .addEventListener("show.bs.collapse", async () => {
                const filaments = await fetch("/api/equipment/filaments").then(r => r.json());
                const group = document.querySelector("#filamentCollapse .equipment-group");
                group.innerHTML = filaments.map(f => `
                    <input type="checkbox" class="btn-check" id="filament-${f.filament_id}" autocomplete="off">
                    <label class="btn" for="filament-${f.filament_id}">${f.type}</label>
                `).join("");
            });

        // ── Save selected printers ───────────────────────────────────────────
        async function savePrinters() {
            const checked = [...document.querySelectorAll("#printerCollapse .btn-check:checked")]
                .map(el => parseInt(el.id.replace("printer-", "")));
            const userId = sessionStorage.getItem("hub3d_user_id");
            await fetch("/api/equipment/user-printers", {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-user-id": userId },
                body: JSON.stringify({ printerIds: checked })
            });
            loadUserEquipment();
            bootstrap.Collapse.getInstance(document.getElementById("printerCollapse")).hide();
        }

        // ── Save selected filaments ──────────────────────────────────────────
        async function saveFilaments() {
            const checked = [...document.querySelectorAll("#filamentCollapse .btn-check:checked")]
                .map(el => parseInt(el.id.replace("filament-", "")));
            const userId = sessionStorage.getItem("hub3d_user_id");
            await fetch("/api/equipment/user-filaments", {
                method: "POST",
                headers: { "Content-Type": "application/json", "x-user-id": userId },
                body: JSON.stringify({ filamentIds: checked })
            });
            loadUserEquipment();
            bootstrap.Collapse.getInstance(document.getElementById("filamentCollapse")).hide();
        }

    </script>

</body>
</html>
