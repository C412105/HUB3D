<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — HUB3D</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="HUB3Dvo.css">
    <script src="HUB3dv0.js" defer></script>
</head>
<body>

    <!-- ========================== NAVBAR ========================== -->
    <nav id="navbar" class="navbar navbar-expand-lg mx-3 my-3">
        <div class="container-fluid">
            <a href="homeHUB3Dv0.html" class="navbar-brand mb-0">
                <h1 class="navbar-brand mb-0">HUB3D</h1>
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item">
                        <a class="nav-link" href="designsHUB3Dv0.html">Designs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactHUB3Dv0.html">Contact</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex align-items-center me-2">
                <div id="profileAvatar" style="width:38px; height:38px; font-size:1rem;">U</div>
            </div>
        </div>
    </nav>

    <!-- ========================== CONTENT ========================== -->
    <main class="page-content container mt-4 mb-5">

        <!-- User info bar -->
         <!-- TO DO: Bring joined date and printer/filament quantities from backend -->
        <div id="profileHeader">
            <div id="profileAvatar">U</div>
            <div>
                <p class="profile-name">User_1234</p>
                <p class="profile-sub">Member since August 2025 · 2 printers · 2 filaments</p>
            </div>
            <button class="btn-logout ms-auto" type="button">Logout</button>
        </div>

        <!-- Printers & Filaments -->
        <div class="row g-4 align-items-start">

            <!-- Printers column -->
            <div class="col-lg-6">
                <h4 class="mb-3">My printer(s)</h4>

                <div class="profile-list-row">
                    <div>
                        <p class="item-label">Ender 3</p>
                        <p class="item-sub">Creality</p>
                    </div>
                    <button class="btn-remove" type="button">Remove</button>
                </div>

                <div class="profile-list-row">
                    <div>
                        <p class="item-label">Prusa MK4</p>
                        <p class="item-sub">Prusa Research</p>
                    </div>
                    <button class="btn-remove" type="button">Remove</button>
                </div>

                <!-- Toggleable (printer checkbox panel collapse control) -->
                <button class="btn btn-sm mt-2"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#printerCollapse"
                        aria-expanded="false"
                        aria-controls="printerCollapse">
                    + Add printer
                </button>
            

            <!-- TO DO: Backend reads .active on labels to know which printers are selected -->
            <div class="collapse mt-3" id="printerCollapse">
                    <div class="equipment-group mb-3" role="group" aria-label="Printer selection">
                        <input type="checkbox" class="btn-check" id="printer-ender3" autocomplete="off">
                        <label class="btn" for="printer-ender3">Ender 3</label>

                        <input type="checkbox" class="btn-check" id="printer-ender3pro" autocomplete="off">
                        <label class="btn" for="printer-ender3pro">Ender 3 Pro</label>

                        <input type="checkbox" class="btn-check" id="printer-prusaMK4" autocomplete="off">
                        <label class="btn" for="printer-prusaMK4">Prusa MK4</label>

                        <input type="checkbox" class="btn-check" id="printer-bambuX1" autocomplete="off">
                        <label class="btn" for="printer-bambuX1">Bambu Lab X1</label>

                        <input type="checkbox" class="btn-check" id="printer-bambuP1S" autocomplete="off">
                        <label class="btn" for="printer-bambuP1S">Bambu Lab P1S</label>

                        <input type="checkbox" class="btn-check" id="printer-kobra" autocomplete="off">
                        <label class="btn" for="printer-kobra">Anycubic Kobra</label>

                        <input type="checkbox" class="btn-check" id="printer-voron" autocomplete="off">
                        <label class="btn" for="printer-voron">Voron 2.4</label>

                        <input type="checkbox" class="btn-check" id="printer-artillery" autocomplete="off">
                        <label class="btn" for="printer-artillery">Artillery Sidewinder</label>
                    </div>
                    <div class="equipment-actions">
                        <!-- <button class="btn btn-sm" type="button">Reset</button> -->
                        <button class="btn btn-sm" type="button">Save</button>
                    </div>
                </div>
            </div>

            <!-- Filaments column -->
            <div class="col-lg-6">
                <h4 class="mb-3">My filament(s)</h4>

                <div class="profile-list-row">
                    <div>
                        <p class="item-label">PLA</p>
                        <p class="item-sub">All brands</p>
                    </div>
                    <button class="btn-remove" type="button">Remove</button>
                </div>

                <div class="profile-list-row">
                    <div>
                        <p class="item-label">PETG</p>
                        <p class="item-sub">All brands</p>
                    </div>
                    <button class="btn-remove" type="button">Remove</button>
                </div>

                <!-- Toggleable (filament checkbox panel collapse control) -->
                <button class="btn btn-sm mt-2"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#filamentCollapse"
                        aria-expanded="false"
                        aria-controls="filamentCollapse">
                    + Add filament
                </button>

                <!-- TO DO: Backend reads .active on labels to know which filaments are selected -->
                <div class="collapse mt-3" id="filamentCollapse">
                    <div class="equipment-group mb-3" role="group" aria-label="Filament selection">
                        <input type="checkbox" class="btn-check" id="fil-pla" autocomplete="off">
                        <label class="btn" for="fil-pla">PLA</label>

                        <input type="checkbox" class="btn-check" id="fil-petg" autocomplete="off">
                        <label class="btn" for="fil-petg">PETG</label>

                        <input type="checkbox" class="btn-check" id="fil-abs" autocomplete="off">
                        <label class="btn" for="fil-abs">ABS</label>

                        <input type="checkbox" class="btn-check" id="fil-tpu" autocomplete="off">
                        <label class="btn" for="fil-tpu">TPU</label>

                        <input type="checkbox" class="btn-check" id="fil-asa" autocomplete="off">
                        <label class="btn" for="fil-asa">ASA</label>

                        <input type="checkbox" class="btn-check" id="fil-nylon" autocomplete="off">
                        <label class="btn" for="fil-nylon">Nylon</label>

                        <input type="checkbox" class="btn-check" id="fil-hips" autocomplete="off">
                        <label class="btn" for="fil-hips">HIPS</label>

                        <input type="checkbox" class="btn-check" id="fil-resin" autocomplete="off">
                        <label class="btn" for="fil-resin">Resin</label>
                    </div>
                    <div class="equipment-actions">
                        <!-- <button class="btn btn-sm" type="button">Reset</button> -->
                        <button class="btn btn-sm" type="button">Save</button>
                    </div>
                </div>
            </div>

        </div>
        
    </main>

    <!-- ========================== FOOTER ========================== -->
    <footer id="disclaimer">
        <p class="mb-0">For educational purposes only · Not for commercial use · HUB3D 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
