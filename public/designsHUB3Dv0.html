<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and filter thousands of 3D printable designs from MyMiniFactory, Cults3D, Thingiverse and Printables.">
    <title>HUB3D — Designs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="HUB3Dvo.css">
    <link rel="icon" type="image/svg+xml" href="Media/SVG/ISOTIPO.svg">
    <script src="HUB3dv0.js" defer></script>
</head>
<body>
   
    <!-- ========================== NAVBAR ========================== -->
    <nav id="navbar" class="navbar navbar-expand-lg mx-3 my-3">
        <div class="container-fluid">

            <!-- Logo / brand -->
            <a href="homeHUB3Dv0.html" class="navbar-brand mb-0 d-flex align-items-center">
                <img src="Media/SVG/LOGO_ANIMADO.svg" alt="HUB3D Logo" class="navbar-logo">
            </a>

            <!-- Hamburger toggle (data-bs-toggle="collapse" Bootstrap JS component) -->
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav"
                    aria-controls="navbarNav"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation links — Collapses into burger, ms-auto aligns them right -->

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto me-4">
                    <li class="nav-item">
                        <a class="nav-link disabled" aria-disabled="true">Designs</a>
                    </li>
                    <li class="nav-item show-if-logged-in" style="display:none">
                        <a class="nav-link" href="profileHUB3Dv0.html">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contactHUB3Dv0.html">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ========================== CONTENT ========================== -->
    <main class="page-content container mt-4 mb-5">

    <!-- ========================== FILTERS ========================== -->
    <!-- Search input + filter dropdowns. Source filter is wired to loadDesigns();
         Printer and Filament dropdowns are disabled stubs for the demo (coming soon). -->
    <div class="row g-2 align-items-start mb-3">
        <!-- LEFT: keyword search -->
        <div class="col-12 col-md-6">
            <div class="d-flex gap-2">
                <input type="text" id="searchInput" class="form-control"
                    placeholder="Search designs..."
                    aria-label="Search designs"
                    style="background:#262624; color:#fff; border-color:#545454;"
                    onkeydown="if(event.key==='Enter') triggerSearch()">
                <button class="btn btn-sm flex-shrink-0" type="button"
                        onclick="triggerSearch()">Search</button>
            </div>
        </div>

        <!-- RIGHT: filter dropdowns -->
        <div class="col-12 col-md-6">
            <div class="d-flex gap-2 flex-wrap">

                <!-- Rating (coming soon — no rating column in DB yet) -->
                <select id="ratingFilter" class="form-select filter-select" aria-label="Filter by rating"
                        disabled title="Rating filter — coming soon">
                    <option value="">Rating (coming soon)</option>
                </select>

                <!-- Printer (coming soon — no DB column to filter against yet) -->
                <select id="printerFilter" class="form-select filter-select" aria-label="Filter by printer"
                        disabled title="Printer filter — coming soon">
                    <option value="">Printer (coming soon)</option>
                </select>

                <!-- Filament (coming soon — no DB column to filter against yet) -->
                <select id="filamentFilter" class="form-select filter-select" aria-label="Filter by filament"
                        disabled title="Filament filter — coming soon">
                    <option value="">Filament (coming soon)</option>
                </select>

                <!-- Source (values = source_id in design_sources table) -->
                <select id="sourceFilter" class="form-select filter-select" aria-label="Filter by source">
                    <option value="">All sources</option>
                    <option value="1">MyMiniFactory</option>
                    <option value="2">Cults3D</option>
                    <option value="3">Thingiverse</option>
                    <option value="4">Printables</option>
                </select>

            </div>
        </div>
    </div>

    <!-- Coming soon note for disabled filters -->
    <p class="filters-coming-soon-note">
        <i class="bi bi-info-circle me-1" style="color:#4ca2b5;"></i>
        Rating · Printer · Filament filters are coming soon
    </p>

    <!-- ========================== FILTER INDICATOR PILLS ==========================
         Toggle buttons that activate special filter modes.
         Green = My Setup Only (compat_check = true designs)
         Blue  = Favourites   (user's saved designs)
         toggleIndicator() handles mutual exclusivity and calls loadDesigns(1).
         resetFilters() clears all state and returns to the default view. -->
    <div class="d-flex gap-3 mb-4 align-items-center flex-wrap">
        <button class="filter-indicator ind-off" id="indSetup"
                onclick="toggleIndicator('indSetup', 'ind-green')">
            ✓ My setup only
        </button>
        <button class="filter-indicator ind-off" id="indFavs"
                onclick="toggleIndicator('indFavs', 'ind-blue')">
            ♡ Favourites
        </button>
        <button class="btn-reset-filters" id="btnResetFilters" onclick="resetFilters()">
            ↺ Reset filters
        </button>
    </div>

        <!-- ========================== DESIGNS GRID ==========================
             Cards injected here by renderCard() on each loadDesigns() call.
             Bootstrap responsive grid: 2 → 3 → 4 → 5 columns as screen widens. -->
        <div id="designsGrid"
             class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-xl-5 g-3 mb-4">
            <!-- cards injected here -->
        </div>

        <!-- Pagination — injected by renderPagination() -->
        <nav aria-label="Designs pagination">
            <div id="pagination"></div>
        </nav>

    </main>

    <!-- ========================== FOOTER ========================== -->
    <footer id="disclaimer">
        <p class="mb-0 text-center">For educational purposes only · Not for commercial use · HUB3D 2026</p>
    </footer>

    <!-- Bootstrap / JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- ========================== FUNCTIONS ========================== -->
    <script>

        // Source name lookup — matches seed order in design_sources table
        const SOURCE_NAMES = { 1: "MyMiniFactory", 2: "Cults3D", 3: "Thingiverse", 4: "Printables" };

        // ── State ────────────────────────────────────────────────────
        let currentPage   = 1;
        let currentQuery  = "";
        let currentSource = "";
        let mySetupOnly   = false;
        let favsOnly      = false;
        let userFavIds    = new Set(); // design_ids the user has favourited

        // ── Load the user's favourited design IDs on page load ───────
        async function loadFavIds() {
            const userId = sessionStorage.getItem("hub3d_user_id");
            if (!userId) return;
            const data = await fetch("/api/favourites",
                { headers: { "x-user-id": userId } }).then(r => r.json());
            userFavIds = new Set((data || []).map(d => d.design_id));
        }

        // ── Build one card's HTML ────────────────────────────────────
        function renderCard(design) {
            const isFav      = userFavIds.has(design.design_id);
            const heartIcon  = isFav ? "bi-heart-fill" : "bi-heart";
            const heartClass = isFav ? "fav-btn active"  : "fav-btn";
            const ariaLabel  = isFav ? "Remove from favourites" : "Add to favourites";
            const source     = SOURCE_NAMES[design.source_id] || "Unknown";
            const thumb      = design.thumbnail_url || "Media/image-placeholder.jpg";
            const href       = design.design_url    || "#";

            return `
                <div class="col">
                    <div class="design-card h-100">
                        <!-- Thumbnail links to the original design page -->
                        <a href="${href}" target="_blank" rel="noopener noreferrer">
                            <img src="${thumb}"
                                 class="card-img-top"
                                 alt="${design.title}"
                                 onerror="this.src='Media/image-placeholder.jpg'">
                        </a>
                        <div class="card-body">
                            <div>
                                <!-- Title also links to the original design page -->
                                <a href="${href}" target="_blank" rel="noopener noreferrer" class="card-title-link">
                                    <p class="card-title mb-0">${design.title}</p>
                                </a>
                                <p class="card-source">${source}</p>
                            </div>
                            <button class="${heartClass}"
                                    onclick="toggleFav(this, ${design.design_id})"
                                    aria-label="${ariaLabel}">
                                <i class="bi ${heartIcon}"></i>
                            </button>
                        </div>
                    </div>
                </div>`;
        }

        // ── Fetch designs and render grid ────────────────────────────
        async function loadDesigns(page = 1) {
            currentPage = page;
            const userId = sessionStorage.getItem("hub3d_user_id");
            const grid   = document.getElementById("designsGrid");

            // Show a loading state
            grid.innerHTML = `<p class="text-center text-muted w-100 py-4">Loading...</p>`;

            let url, designs, total, limit = 20;

            try {
                if (favsOnly) {
                    // Load all favourites then apply active keyword/source filters client-side
                    const raw = await fetch("/api/favourites",
                        { headers: { "x-user-id": userId } }).then(r => r.json());
                    let filtered = raw || [];
                    if (currentQuery)
                        filtered = filtered.filter(d =>
                            d.title?.toLowerCase().includes(currentQuery.toLowerCase()));
                    if (currentSource)
                        filtered = filtered.filter(d =>
                            String(d.source_id) === String(currentSource));
                    designs = filtered;
                    total   = filtered.length;
                } else if (mySetupOnly) {
                    // Pass active keyword and source filters to the backend
                    const params = new URLSearchParams();
                    if (currentQuery)  params.set("q",      currentQuery);
                    if (currentSource) params.set("source", currentSource);
                    const data = await fetch(`/api/designs/my-setup?${params}`).then(r => r.json());
                    designs = data || [];
                    total   = designs.length;
                } else {
                    // Standard paginated load with optional filters
                    const params = new URLSearchParams({ page });
                    if (currentQuery)  params.set("q",      currentQuery);
                    if (currentSource) params.set("source", currentSource);
                    const data = await fetch(`/api/designs?${params}`).then(r => r.json());
                    designs = data.designs || [];
                    total   = data.total   || 0;
                    limit   = data.limit   || 20;
                }
            } catch (err) {
                grid.innerHTML = `<p class="text-center text-muted w-100 py-4">Failed to load designs.</p>`;
                return;
            }

            // Render cards
            grid.innerHTML = designs.length
                ? designs.map(renderCard).join("")
                : `<p class="text-center text-muted w-100 py-4">No designs found.</p>`;

            // Render pagination (skip for favs/my-setup since they return all results)
            renderPagination(page, total, limit);
        }

        // ── Build pagination controls ────────────────────────────────
        function renderPagination(page, total, limit) {
            const paginationEl = document.getElementById("pagination");
            const totalPages   = Math.ceil(total / limit);

            if (totalPages <= 1) { paginationEl.innerHTML = ""; return; }

            const atFirst = page <= 1;
            const atLast  = page >= totalPages;

            // Up to 5 page number buttons centred around current page
            const start = Math.max(1, page - 2);
            const end   = Math.min(totalPages, start + 4);
            let pageItems = "";
            for (let i = start; i <= end; i++) {
                const active = i === page ? "active" : "";
                pageItems += `
                    <li class="page-item ${active}">
                        <a class="page-link" href="#"
                           onclick="loadDesigns(${i}); return false;">${i}</a>
                    </li>`;
            }

            // Layout: [« First  Previous]   [page numbers]   [Next  Last »]
            paginationEl.innerHTML = `
                <ul class="pagination mb-0">
                    <li class="page-item ${atFirst ? "disabled" : ""}">
                        <a class="page-link" href="#"
                           onclick="loadDesigns(1); return false;" title="First page">«</a>
                    </li>
                    <li class="page-item ${atFirst ? "disabled" : ""}">
                        <a class="page-link" href="#"
                           onclick="loadDesigns(${page - 1}); return false;">Previous</a>
                    </li>
                </ul>
                <ul class="pagination mb-0">
                    ${pageItems}
                </ul>
                <ul class="pagination mb-0">
                    <li class="page-item ${atLast ? "disabled" : ""}">
                        <a class="page-link" href="#"
                           onclick="loadDesigns(${page + 1}); return false;">Next</a>
                    </li>
                    <li class="page-item ${atLast ? "disabled" : ""}">
                        <a class="page-link" href="#"
                           onclick="loadDesigns(${totalPages}); return false;" title="Last page">»</a>
                    </li>
                </ul>`;
        }

        // ── Toggle favourite (hits API + updates icon) ───────────────
        async function toggleFav(btn, designId) {
            const userId = sessionStorage.getItem("hub3d_user_id");
            if (!userId) return;

            const icon     = btn.querySelector("i");
            const isActive = btn.classList.contains("active");

            if (isActive) {
                const res = await fetch(`/api/favourites/${designId}`, {
                    method: "DELETE",
                    headers: { "x-user-id": userId }
                });
                if (res.ok) {
                    icon.classList.replace("bi-heart-fill", "bi-heart");
                    btn.classList.remove("active");
                    btn.setAttribute("aria-label", "Add to favourites");
                    userFavIds.delete(designId);
                }
            } else {
                const res = await fetch("/api/favourites", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "x-user-id": userId },
                    body: JSON.stringify({ designId })
                });
                if (res.ok) {
                    icon.classList.replace("bi-heart", "bi-heart-fill");
                    btn.classList.add("active");
                    btn.setAttribute("aria-label", "Remove from favourites");
                    userFavIds.add(designId);
                }
            }
        }

        // ── Trigger keyword search (called by button click and Enter key) ──
        function triggerSearch() {
            currentQuery = document.getElementById("searchInput").value.trim();
            loadDesigns(1);
        }

        // ── Reset all filters to default state ───────────────────────
        function resetFilters() {
            // Clear JS state
            currentQuery  = "";
            currentSource = "";
            mySetupOnly   = false;
            favsOnly      = false;

            // Clear UI controls
            document.getElementById("searchInput").value  = "";
            document.getElementById("sourceFilter").value = "";

            // Reset indicator pills to off
            const setup = document.getElementById("indSetup");
            const favs  = document.getElementById("indFavs");
            setup.className = "filter-indicator ind-off";
            favs.className  = "filter-indicator ind-off";

            loadDesigns(1);
        }

        // ── Filter indicator pills ───────────────────────────────────
        function toggleIndicator(id, activeClass) {
            const el = document.getElementById(id);
            if (el.classList.contains("ind-off")) {
                el.classList.remove("ind-off");
                el.classList.add(activeClass);
                if (id === "indSetup") { mySetupOnly = true;  favsOnly    = false; document.getElementById("indFavs").classList.replace("ind-blue","ind-off") || document.getElementById("indFavs").classList.add("ind-off"); }
                if (id === "indFavs")  { favsOnly    = true;  mySetupOnly = false; document.getElementById("indSetup").classList.replace("ind-green","ind-off") || document.getElementById("indSetup").classList.add("ind-off"); }
            } else {
                el.classList.remove(activeClass);
                el.classList.add("ind-off");
                if (id === "indSetup") mySetupOnly = false;
                if (id === "indFavs")  favsOnly    = false;
            }
            loadDesigns(1);
        }

        // ── Init ─────────────────────────────────────────────────────
        // Note: search button click and Enter key are wired inline on "Trigger keyword search".
        document.addEventListener("DOMContentLoaded", async () => {

            // Auto-reload when the search field is cleared completely
            document.getElementById("searchInput").addEventListener("input", e => {
                if (e.target.value === "") {
                    currentQuery = "";
                    loadDesigns(1);
                }
            });

            // Source filter dropdown
            document.getElementById("sourceFilter").addEventListener("change", e => {
                currentSource = e.target.value;
                loadDesigns(1);
            });

            await loadFavIds();
            loadDesigns(1);
        });

    </script>

</body>
</html>
