<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUB3D</title>
    <script src="HUB3dv0.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="HUB3Dvo.css">
</head>
<body>
   
    <!-- NavBar -->
    <nav id="navbar" class="navbar navbar-expand-lg mx-3 my-3">
        <div class="container-fluid">
            <h1 class="navbar-brand" href="#">HUB3D</h1>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">My equipment</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Designs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Profile</a>
                    </li>
                </ul>
            </div>
        </div>
        
        <div>
            <form class="container-fluid justify-content-start">
                <button class="btn btn-sm me-2" type="button">Login</button>
                <button class="btn btn-sm me-2" type="button">Sign up</button>
            </form>
        </div>
    </nav>

    <!-- Title -->
    <div id="homeTitle" class="container mb-5 text-center">
        <h2>Find 3D prints for your setup</h2>
        <p>Browse thousands of designs from top sites — filtered for your exact printers and filaments.</p>
    </div>

    <!-- Carousel (ID used for controls) -->
    <div class="container text-center">
        <!-- <h2>Supported third-party design websites</h2>   -->
        <div id="sitesCarousel" class="carousel slide" data-bs-ride="carousel">

        <!-- Indicators -->
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#sitesCarousel" data-bs-slide-to="0" class="active"></button>
                <button type="button" data-bs-target="#sitesCarousel" data-bs-slide-to="1"></button>
                <button type="button" data-bs-target="#sitesCarousel" data-bs-slide-to="2"></button>
                <button type="button" data-bs-target="#sitesCarousel" data-bs-slide-to="3"></button>
            </div>

                <!-- Slides -->
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="Media/MyMiniFactoryLogo.png" alt="MyMiniFactory" style="width:50%;">
                </div>
                <div class="carousel-item">
                    <img src="Media/Cults3DLogo.png" alt="Cults3D" style="width:50%;">
                </div>
                <div class="carousel-item">
                    <img src="Media/ThingiverseLogo.png" alt="Thingiverse" style="width:50%;">
                </div>
                <div class="carousel-item">
                    <img src="Media/PrintablesLogo.png" alt="Printables" style="width:50%;">
                </div>
            </div>

                <!-- Controls -->
            <button class="carousel-control-prev" type="button" data-bs-target="#sitesCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#sitesCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
                <span class="visually-hidden">Next</span>
            </button>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</body>
</html>
